name: CI/CD Pipeline for aurora_chatbot backend application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

    #1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v5

    # 2. Load environment variables (from secrets only)
    - name: Load environment variables
      run: |
        echo "AWS_REGION=${{secrets.AWS_REGION}}" >> $GITHUB_ENV
        echo "ECR_REGISTRY=${{secrets.ECR_REGISTRY}}" >> $GITHUB_ENV
        echo "ECR_REPOSITORY=${{secrets.ECR_REPOSITORY}}" >> $GITHUB_ENV

        echo "OPENAI_API_KEY=${{secrets.OPENAI_API_KEY}}" >> $GITHUB_ENV
        echo "PINECONE_API_KEY=${{secrets.PINECONE_API_KEY}}" >> $GITHUB_ENV
        echo "PINECONE_ENVIRONMENT=${{secrets.PINECONE_ENVIRONMENT}}" >> $GITHUB_ENV
        echo "PINECONE_INDEX_NAME=${{secrets.PINECONE_INDEX_NAME}}" >> $GITHUB_ENV
        echo "PINECONE_CONVERSATION_INDEX=${{secrets.PINECONE_CONVERSATION_INDEX}}" >> $GITHUB_ENV

    # 3. Configure AWS Credentials (ONLY for Github to ECR push)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    #4. Login to ECR (Github side)
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr

    # 5. Build Docker image
    - name: Build Docker image
      run: |
       docker build -t $ECR_REPOSITORY .
      
    # 6. Tag docker image
    - name: Tag Docker image
      run: | 
        docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 7. Push image to ECR
    - name: Push image to ECR
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 8. Deploy to EC2 (NO AWS KEYS HERE)
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v0.1.6
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
        PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        PINECONE_CONVERSATION_INDEX: ${{ secrets.PINECONE_CONVERSATION_INDEX }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: OPENAI_API_KEY,PINECONE_API_KEY,PINECONE_ENVIRONMENT,PINECONE_INDEX_NAME,PINECONE_CONVERSATION_INDEX
        script: |
          set -e

          echo "Stopping old container..."
          docker stop fastapi-app || true
          docker rm fastapi-app || true

          echo "Logging into ECR using IAM role..."
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

          echo "Pulling latest image..."
          docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

          echo "Running new container..."
          docker run -d \
            -p 8000:8000 \
            --name fastapi-app \
            --restart unless-stopped \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e PINECONE_API_KEY="$PINECONE_API_KEY" \
            -e PINECONE_ENVIRONMENT="$PINECONE_ENVIRONMENT" \
            -e PINECONE_INDEX_NAME="$PINECONE_INDEX_NAME" \
            -e PINECONE_CONVERSATION_INDEX="$PINECONE_CONVERSATION_INDEX" \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest