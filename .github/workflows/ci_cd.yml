name: CI/CD Pipeline for aurora_chatbot backend application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Configure AWS Credentials (OIDC — only for ECR push)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3.5. Set up Docker Buildx (required for cache support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build & push with caching, tagged by commit SHA + latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DockerFile.backend
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Deploy to EC2 via SSH (no AWS keys here — IAM instance role handles ECR auth)
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CONVERSATION_INDEX: ${{ secrets.PINECONE_CONVERSATION_INDEX }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: OPENAI_API_KEY,PINECONE_API_KEY,PINECONE_ENVIRONMENT,PINECONE_INDEX_NAME,PINECONE_CONVERSATION_INDEX,IMAGE_TAG
          script: |
            set -e

            REGISTRY="${{ secrets.ECR_REGISTRY }}"
            REPO="${{ secrets.ECR_REPOSITORY }}"
            REGION="${{ secrets.AWS_REGION }}"
            NEW_TAG="$IMAGE_TAG"

            echo "Logging into ECR..."
            aws ecr get-login-password --region "$REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            echo "Pulling new image ($NEW_TAG)..."
            docker pull "$REGISTRY/$REPO:$NEW_TAG"

            # Record currently running image so we can roll back if needed
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' fastapi-app 2>/dev/null || echo "")

            echo "Stopping old container..."
            docker stop fastapi-app || true
            docker rm fastapi-app || true

            echo "Starting new container..."
            docker run -d \
              -p 8000:8000 \
              --name fastapi-app \
              --restart unless-stopped \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e PINECONE_API_KEY="$PINECONE_API_KEY" \
              -e PINECONE_ENVIRONMENT="$PINECONE_ENVIRONMENT" \
              -e PINECONE_INDEX_NAME="$PINECONE_INDEX_NAME" \
              -e PINECONE_CONVERSATION_INDEX="$PINECONE_CONVERSATION_INDEX" \
              "$REGISTRY/$REPO:$NEW_TAG"

            echo "Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 10); do
              sleep 3
              if curl -sf http://localhost:8000/health > /dev/null; then
                HEALTHY=true
                break
              fi
              echo "Attempt $i: not healthy yet..."
            done

            if [ "$HEALTHY" = false ]; then
              echo "Health check failed. Rolling back..."
              docker stop fastapi-app || true
              docker rm fastapi-app || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker run -d \
                  -p 8000:8000 \
                  --name fastapi-app \
                  --restart unless-stopped \
                  -e OPENAI_API_KEY="$OPENAI_API_KEY" \
                  -e PINECONE_API_KEY="$PINECONE_API_KEY" \
                  -e PINECONE_ENVIRONMENT="$PINECONE_ENVIRONMENT" \
                  -e PINECONE_INDEX_NAME="$PINECONE_INDEX_NAME" \
                  -e PINECONE_CONVERSATION_INDEX="$PINECONE_CONVERSATION_INDEX" \
                  "$PREVIOUS_IMAGE"
                echo "Rolled back to $PREVIOUS_IMAGE"
              else
                echo "No previous image recorded — manual intervention required."
              fi
              exit 1
            fi

            echo "Deploy succeeded. Pruning old images..."
            docker image prune -f